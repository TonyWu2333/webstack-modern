# ============================================================
#  站点设置
# ============================================================
site:
  title: Tony的导航站
  name: Tony的导航站        # 侧栏显示的站点名（不设置 logo 时使用文字 Logo）
  mark: T                   # 文字 Logo 方块里的字，不填取 name 第一个字
  description: 个人常用网站收藏
  keywords: 网址导航,设计导航,工具导航
  # 以下图片路径相对于仓库根目录，也可以填完整的 https:// 地址
  favicon: assets/images/favicon.png
  # 想用图片 Logo 时取消下面两行注释（原版 WebStack 图片 Logo 仍在 assets/images 里）
  # logo: assets/images/logo@2x.png                  # 侧栏展开时的 Logo
  # logo_collapsed: assets/images/logo-collapsed@2x.png  # 侧栏收起时的 Logo
  # 顶部右侧链接，可删除或增加
  top_links:
    - name: GitHub
      icon: fa-github
      url: https://github.com/TonyWu2333/webstack-modern
  # 页脚，支持 HTML
  footer: >-
    &copy; 2026 Tony的导航站 · 主题基于
    <a href="https://github.com/WebStackPage/WebStackPage.github.io" target="_blank"><strong>WebStack</strong></a> 美化
  # 插入到 <head> 里的额外 HTML（比如你自己的统计代码），不需要就留空
  head: ""

# ============================================================
#  导航数据
#  - 一级分类：name + icon，然后二选一：
#      links:    直接放链接
#      children: 放二级分类（每个二级分类有 name、links，可选 badge）
#  - 链接：title、url 必填；desc 描述可选；
#          logo 填 assets/images/logos/ 下的文件名，或完整图片 URL，不填用默认图标
#  - 分类图标：Font Awesome 4.2 的类名（如 fa-star，见 assets/css/fonts/fontawesome/css/font-awesome.css）
#    或 linecons 的类名（如 linecons-star，见 assets/css/fonts/linecons/css/linecons.css）
# ============================================================
