# ============================================================
#  站点设置
# ============================================================
site:
  title: 我的网址导航
  description: 个人常用网站收藏
  keywords: 网址导航,设计导航,工具导航
  # 以下图片路径相对于仓库根目录，也可以填完整的 https:// 地址
  favicon: assets/images/favicon.png
  logo: assets/images/logo@2x.png                  # 侧栏展开时的 Logo
  logo_collapsed: assets/images/logo-collapsed@2x.png  # 侧栏收起时的 Logo
  # 顶部右侧链接，可删除或增加
  top_links:
    - name: GitHub
      icon: fa-github
      url: https://github.com/TonyWu2333/webstack-nav
  # 页脚，支持 HTML
  footer: >-
    &copy; 2026 我的网址导航 · Theme by
    <a href="https://github.com/WebStackPage/WebStackPage.github.io" target="_blank"><strong>WebStack</strong></a>
  # 插入到 <head> 里的额外 HTML（比如你自己的统计代码），不需要就留空
  head: ""

# ============================================================
#  导航数据
#  - 一级分类：name + icon，然后二选一：
#      links:    直接放链接
#      children: 放二级分类（每个二级分类有 name、links，可选 badge）
#  - 链接：title、url 必填；desc 描述可选；
#          logo 填 assets/images/logos/ 下的文件名，或完整图片 URL，不填用默认图标
#  - 图标可选值见 assets/css/fonts/linecons/css/linecons.css（如 linecons-star）
# ============================================================
